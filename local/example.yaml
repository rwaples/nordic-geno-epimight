# Copy to local/<your site>.yaml and fill in. Files in local/ other than this example are
# not committed: they describe your site's data.
site: Denmark                         # the name your results carry
plan: ../plan/initial.yaml            # the shared plan: initial.yaml, later complete.yaml
data_folder: /path/to/trait/files     # one trait file per trait in the plan
pedigree_path: /path/to/pedigree.tsv  # the pedigree; it need not be in data_folder
study_end: 2021-12-31                 # end of register follow-up at this site
threads: 4                            # optional, default 1
