# Runs the pixi route (install, setup, unit tests, self-test) on Windows, with Linux on the
# same steps as a control. Every step runs even after one fails, so one run lists every
# failure; the last step fails the job if any did.
name: windows

on:
  push:
    branches: [windows-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # remotes::install_github in setup reads it, which lifts GitHub's rate limit.
      GITHUB_PAT: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false
      - id: install
        continue-on-error: true
        run: pixi install --locked
      # Windows only: pedigreegraph from its pin with ci/pedigreegraph/Makevars.win laid
      # over it, stamped with the pin's commit so setup keeps it. The bare cargo build
      # first prints the native libraries the static library needs.
      - id: pedigreegraph
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          commit=$(sed -n '/^pedigreegraph:/,/^[a-z]/s/^  commit: //p' kit/nordicepimight/inst/pins.yaml)
          pg="$(cygpath -m "$RUNNER_TEMP")/pedigree-graph"
          git clone --quiet https://github.com/rwaples/pedigree-graph "$pg"
          git -C "$pg" checkout --quiet "$commit"
          cp ci/pedigreegraph/Makevars.win "$pg/r/src/"
          printf 'RemoteSha: %s\n' "$commit" >> "$pg/r/DESCRIPTION"
          pixi run --locked cargo rustc --lib --release --target x86_64-pc-windows-gnu \
            --manifest-path "$pg/r/src/rust/Cargo.toml" --target-dir "$pg/r/src/rust/target" \
            -- --print native-static-libs
          pixi run --locked R CMD INSTALL "$pg/r"
      - id: setup
        continue-on-error: true
        run: pixi run --locked setup
      - id: test
        continue-on-error: true
        run: pixi run --locked test
      - id: selftest
        continue-on-error: true
        run: pixi run --locked selftest selftest-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-out-${{ matrix.os }}
          path: selftest-out
          if-no-files-found: ignore
          retention-days: 7
      - name: Outcome
        if: always()
        shell: bash
        # A skipped step (pedigreegraph on Linux) counts as passed.
        run: |
          status=0
          table="| step | ${{ matrix.os }} |"$'\n'"|---|---|"
          for pair in "install=${{ steps.install.outcome }}" \
                      "pedigreegraph=${{ steps.pedigreegraph.outcome }}" \
                      "setup=${{ steps.setup.outcome }}" "test=${{ steps.test.outcome }}" \
                      "selftest=${{ steps.selftest.outcome }}"; do
            table+=$'\n'"| ${pair%%=*} | ${pair#*=} |"
            case "${pair#*=}" in success | skipped) ;; *) status=1 ;; esac
          done
          echo "$table" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
