# Runs the pixi route (install, setup, unit tests, self-test) on Windows, with Linux on the
# same steps as a control. Every step runs even after one fails, so one run lists every
# failure; the last step fails the job if any did.
#
# The Windows runner has Visual Studio, Rtools, Strawberry Perl's gcc and Git's Unix tools,
# none of which a site's Windows machine needs to have. Before setup, the Windows job cuts
# PATH down to Windows itself, pixi, rustup's MinGW Rust and git, and hides Rtools from
# pkgbuild, so the build uses only what docs/windows.md's install provides.
name: windows

on:
  push:
    branches: [main, windows-ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # remotes::install_github in setup reads it, which lifts GitHub's rate limit.
      GITHUB_PAT: ${{ github.token }}
      # testthat's progress reporter quits after 10 failures; run every test file.
      TESTTHAT_MAX_FAILS: Inf
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false
      # linux-64's locked rust (pixi.lock), which docs/windows.md must name too.
      - id: rust
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          version=$(sed -n 's#.*/linux-64/rust-\([0-9][0-9.]*\)-.*#\1#p' pixi.lock | head -1)
          echo "pixi.lock's rust: $version"
          others=$(grep -o '1\.[0-9][0-9]*\.[0-9][0-9]*' docs/windows.md | sort -u | grep -vx "$version" || true)
          [ -z "$others" ] || { echo "docs/windows.md names Rust $others, not $version"; exit 1; }
          grep -q -- "--default-toolchain $version " docs/windows.md
          rustup toolchain install "$version-x86_64-pc-windows-gnu" --profile minimal
          rustup default "$version-x86_64-pc-windows-gnu"
      - id: install
        continue-on-error: true
        run: pixi install --locked
      - id: path
        name: Cut PATH down to a clean machine's
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $keep = "$env:SystemRoot\System32", $env:SystemRoot, "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0", "$env:ProgramFiles\Git\cmd",
            (Split-Path (Get-Command pwsh).Source), (Split-Path (Get-Command pixi).Source),
            (Split-Path (Get-Command cargo).Source)
          "PATH=$($keep -join ';')" >> $env:GITHUB_ENV
          # A separately installed R's per-user library, as on a site's machine: conda's R
          # names the same folder, and pixi.toml's R_LIBS_USER=NULL must keep it out.
          $rver = pixi run --locked Rscript -e 'cat(R.version$major, strsplit(R.version$minor, "[.]")[[1]][1], sep = ".")'
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\R\win-library\$rver" | Out-Null
          # A user .Renviron that names that library, which pixi.toml's R_ENVIRON_USER skips.
          New-Item -ItemType Directory -Force "$HOME\Documents" | Out-Null
          "R_LIBS_USER=$env:LOCALAPPDATA/R/win-library/$rver" | Set-Content "$HOME\Documents\.Renviron"
          # pkgbuild looks for Rtools in these folders whatever PATH holds.
          "RTOOLS45_HOME=C:\no-rtools" >> $env:GITHUB_ENV
          "RTOOLS44_HOME=C:\no-rtools" >> $env:GITHUB_ENV
      - id: clean
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # Windows' own bash.exe, the WSL launcher, is on every machine and isn't a Unix shell.
          foreach ($tool in 'sh', 'bash', 'gcc', 'make', 'link', 'Rscript') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -ne "$env:SystemRoot\System32\bash.exe" }
            if ($found) { throw "$tool is on PATH: $($found.Source)" }
          }
          $host_line = rustc -vV | Select-String '^host: '
          $host_line.Line
          if ($host_line.Line -ne 'host: x86_64-pc-windows-gnu') { throw 'rustc is not the MinGW host' }
          pixi run --locked Rscript -e "pkgbuild::check_build_tools(debug = TRUE)"
          if ($LASTEXITCODE -ne 0) { throw 'pkgbuild finds no working compiler in the pixi environment' }
      - id: setup
        continue-on-error: true
        run: pixi run --locked setup
      # After setup, which rebuilds Matrix from source: no DLL in the environment may reach
      # another through a 32-bit pseudo-relocation, which crashes at random on load.
      - id: relocs
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pixi run --locked python -I ci/find_pseudo_relocs.py .pixi/envs/default
      - id: test
        continue-on-error: true
        run: pixi run --locked test
      - id: selftest
        continue-on-error: true
        run: pixi run --locked selftest selftest-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-out-${{ matrix.os }}
          path: selftest-out
          if-no-files-found: ignore
          retention-days: 7
      - name: Outcome
        if: always()
        shell: pwsh
        # A skipped step (the Windows-only ones on Linux) counts as passed.
        run: |
          $steps = [ordered]@{
            rust = '${{ steps.rust.outcome }}'; path = '${{ steps.path.outcome }}'
            install = '${{ steps.install.outcome }}'
            clean = '${{ steps.clean.outcome }}'
            setup = '${{ steps.setup.outcome }}'; relocs = '${{ steps.relocs.outcome }}'
            test = '${{ steps.test.outcome }}'
            selftest = '${{ steps.selftest.outcome }}'
          }
          $table = "| step | ${{ matrix.os }} |`n|---|---|"
          $failed = $false
          foreach ($step in $steps.GetEnumerator()) {
            $table += "`n| $($step.Key) | $($step.Value) |"
            if ($step.Value -notin 'success', 'skipped') { $failed = $true }
          }
          $table
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $table
          if ($failed) { exit 1 }
